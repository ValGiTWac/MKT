name: Auto Update from Vibe Code

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message for auto-update'
        required: true
        default: 'Auto-update from Vibe Code'
  repository_dispatch:
    types: [vibe-code-update]

jobs:
  auto-update:
    name: Auto Update and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "Vibe Code Bot"
          git config user.email "vibe-code@whise.com"

      - name: Pull latest changes
        run: git pull origin main

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install functions dependencies
        run: cd functions && npm ci

      - name: Build project
        run: npm run build

      - name: Commit and push changes
        run: |
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "${{ github.event.inputs.message || 'Auto-update from Vibe Code' }}"
            git push origin main
          else
            echo "No changes to commit"
          fi

      - name: Trigger Netlify deployment
        if: success()
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger_name":"auto-update"}' \
            "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys"
